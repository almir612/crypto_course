version: "3.8"

networks:
  data-platform:
    driver: bridge

x-airflow-common: &airflow-common
  build: .
  environment:
    PYTHONPATH: /opt/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
    - ./plugins:/opt/airflow/plugins
    - ./ETL:/opt/airflow/ETL
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - data-platform

services:
  postgres:
    image: postgres:15
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - data-platform

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command: >
      -c "
      airflow db init &&
      airflow users create --username airflow --password airflow --firstname Airflow --lastname Admin --role Admin --email airflow@local
      "
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: crypto
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: devpass
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - clickhouse-data:/var/lib/clickhouse
    networks:
      - data-platform

  superset-db:
    image: postgres:15
    container_name: superset-postgres
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    volumes:
      - superset-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "superset"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - data-platform

  superset-init:
    image: apache/superset:2.1.0
    container_name: superset-init
    depends_on:
      superset-db:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: "supersecretkey"
      DATABASE_URL: "postgresql+psycopg2://superset:superset@superset-db:5432/superset"
    volumes:
      - superset_home:/app/superset_home
    command: >
      sh -c "pip install clickhouse-connect==0.7.6 && superset db upgrade && superset fab create-admin --username admin --password admin --firstname Admin --lastname User --email admin@superset.local && superset init"
    restart: "no"
    networks:
      - data-platform

  superset:
    image: apache/superset:2.1.0
    container_name: superset
    ports:
      - "8088:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    environment:
      SUPERSET_SECRET_KEY: "supersecretkey"
    volumes:
      - superset_home:/app/superset_home
    command: superset run -h 0.0.0.0 -p 8088 --with-threads --reload
    networks:
      - data-platform

volumes:
  postgres-db-volume:
  clickhouse-data:
  superset_home:
  superset-db-data: